name: Merge Dev to Prod

on:
  push:
    branches:
      - dev_test_bundle

  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  merge-dev-to-prod:
    runs-on: ubuntu-latest

    steps:

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(gh pr list \
            --base prod_test_bundle \
            --head dev_test_bundle \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -z "$PR_NUMBER" ]; then
            gh pr create \
              --base prod_test_bundle \
              --head dev_test_bundle \
              --title "Merge dev_test_bundle into prod_test_bundle" \
              --body "Automatically created PR from dev_test_bundle to prod_test_bundle."
          else
            echo "PR already exists: #$PR_NUMBER"
          fi

      - name: Merge Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(gh pr list \
            --base prod_test_bundle \
            --head dev_test_bundle \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -n "$PR_NUMBER" ]; then
            echo "Merging PR #$PR_NUMBER"

            gh pr merge "$PR_NUMBER" \
              --merge \
              --delete-branch=false
          else
            echo "No open PR found."
          fi
