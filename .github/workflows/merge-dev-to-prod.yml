name: Merge Dev to Prod

on:
  push:
    branches:
      - dev

  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  merge-dev-to-prod:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Pull Request
        id: create-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(gh pr list \
            --base prod_test_bundle \
            --head dev \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -z "$PR_NUMBER" ]; then
            PR_URL=$(gh pr create \
              --base prod_test_bundle \
              --head dev \
              --title "Merge dev into prod_test_bundle" \
              --body "Automatically created PR to merge changes from dev into prod_test_bundle.")

            echo "Created PR: $PR_URL"
          else
            echo "PR already exists: #$PR_NUMBER"
          fi

      - name: Merge Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(gh pr list \
            --base prod_test_bundle \
            --head dev \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -n "$PR_NUMBER" ]; then
            gh pr merge "$PR_NUMBER" \
              --merge \
              --delete-branch=false
          else
            echo "No open PR found."
          fi
